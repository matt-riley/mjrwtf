# golangci-lint configuration (v2)
# Note: typecheck is not a configurable linter in v2; see golangci-lint FAQ for typecheck issues.
# The code compiles correctly; historically typecheck had false positives with imports from
# goose, chi, sqlite3, geoip2, and sqlc-generated packages.

version: "2"
run:
  tests: true
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/adapters/repository/sqlc
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/adapters/repository/sqlc